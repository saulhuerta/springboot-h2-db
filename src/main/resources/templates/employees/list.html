<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Matrix | Nómina</title>
    <style>
        body { background-color: #000; color: #00FF41; font-family: 'Courier New', monospace; margin: 40px; }
        h1 { border-bottom: 1px solid #00FF41; padding-bottom: 10px; text-shadow: 0 0 8px #00FF41; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); }
        th, td { border: 1px solid #008F11; padding: 15px; text-align: left; }
        th { background-color: #003B00; color: #FFF; text-transform: uppercase; }
        tr:hover { background-color: #001a00; border: 1px solid #00FF41; }
        .btn { 
            color: #00FF41; border: 1px solid #00FF41; padding: 10px 20px; 
            text-decoration: none; display: inline-block; transition: 0.3s;
        }
        .btn:hover { background: #00FF41; color: #000; box-shadow: 0 0 20px #00FF41; }
    </style>
</head>
<body>
    <h1>[ CONEXIÓN ESTABLECIDA: LISTA DE AGENTES ]</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>EMAIL</th>
                <th>DEPTO</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí Thymeleaf itera sobre el Model -->
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id()}">000</td>
                <td th:text="${emp.firstName() + ' ' + emp.lastName()}">Agente Smith</td>
                <td th:text="${emp.email()}">smith@matrix.com</td>
                <td th:text="${emp.departmentName()}">Seguridad</td>
            </tr>
        </tbody>
    </table>

	<div class="nav-links" style="margin-top: 30px; display: flex; gap: 15px;">
	    <a th:href="@{/}" class="btn">
	        <i class="terminal-icon"></i> _VOLVER_AL_INICIO
	    </a>
	    
	    <!-- Si estás en empleados, pon link a departamentos y viceversa -->
		<a th:if="${currentView == 'employees'}" th:href="@{/view/departments}" class="btn">_IR_A_NODOS_DEPTOS</a>
		<a th:if="${currentView == 'departments'}" th:href="@{/view/employees}" class="btn">_IR_A_AGENTES</a>
		</div>
	</div>
</body>
